<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D-kartan Formulär Admin – Login</title>

  <link rel="stylesheet" href="/admin/vendor/bootstrap.min.css">
  <style>
    body {
      background: #f3f4f6;
    }
    .app {
      max-width: 420px;
      margin: 60px auto;
    }
    .card {
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.15);
    }
    .toggle-group {
      display: flex;
      border-radius: 999px;
      border: 1px solid #d1d5db;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .toggle-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.9rem;
      border: none;
      background: transparent;
      cursor: pointer;
      outline: none;
    }
    .toggle-btn.active {
      background: #111827;
      color: #f9fafb;
    }
    .toggle-btn:not(.active) {
      background: #f9fafb;
      color: #4b5563;
    }
    .toggle-btn + .toggle-btn {
      border-left: 1px solid #d1d5db;
    }
    .subtle {
      color: #6b7280;
      font-size: 0.9rem;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .toastHost {
      position: fixed;
      right: 16px;
      top: 16px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      min-width: 260px;
      max-width: 520px;
      background: #111827;
      color: #fff;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      font-size: 13px;
    }
    .toast .title {
      font-weight: 700;
      margin-bottom: 2px;
    }
    .toast.error {
      border-color: rgba(239,68,68,0.7);
    }
    .toast.success {
      border-color: rgba(16,185,129,0.7);
    }
  </style>
</head>
<body>
  <div class="toastHost" id="toastHost"></div>

  <div class="app">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 mb-1">3D-kartan Formulär Admin – Login</h1>
        <p class="subtle mb-3">
          Logga in för att administrera formulär och svar.
        </p>

        <!-- Switch mellan Forms och Submissions -->
        <div class="toggle-group mb-3">
          <button type="button" id="formsToggle" class="toggle-btn active">Formulärbyggaren admin</button>
          <button type="button" id="subsToggle" class="toggle-btn">Formulärsvar admin</button>
        </div>
        <div class="subtle mb-3">
          Du skickas till den valda sidan efter inloggning.
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="username">Användarnamn</label>
            <input id="username" name="username" class="form-control" autocomplete="username" required />
          </div>

          <div class="mb-3">
            <label for="password">Lösenord</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required />
          </div>

          <button type="submit" id="loginBtn" class="btn btn-primary w-100">
            Logga in
          </button>
        </form>

        <div class="subtle mt-3">
          <div>API: <span class="mono">POST /3d-kartan/backend/auth/login</span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/admin/login.js"></script>
</body>
</html>
